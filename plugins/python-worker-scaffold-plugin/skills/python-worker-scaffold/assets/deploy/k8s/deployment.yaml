apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{PROJECT_NAME}}
  labels:
    app: {{PROJECT_NAME}}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{PROJECT_NAME}}
  template:
    metadata:
      labels:
        app: {{PROJECT_NAME}}
    spec:
      containers:
      - name: worker
        image: your-registry/{{PROJECT_NAME}}:latest
        env:
        - name: WORKER_NAME
          value: "{{PROJECT_NAME}}"
        - name: LOG_LEVEL
          value: "INFO"
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: {{PROJECT_NAME}}-secrets
              key: rabbitmq-url
        - name: QUEUE_NAME
          value: "{{PROJECT_NAME}}_queue"
        - name: PREFETCH_COUNT
          value: "10"
        - name: CLOUDEVENTS_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: {{PROJECT_NAME}}-secrets
              key: signing-key
        - name: CLOUDEVENTS_VERIFICATION_KEY
          valueFrom:
            secretKeyRef:
              name: {{PROJECT_NAME}}-secrets
              key: verification-key
        - name: MAX_RETRIES
          value: "3"
        - name: RETRY_DELAY
          value: "60"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
